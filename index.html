    <!--
      Theme bootstrap. Runs before first paint so the page never flashes the
      wrong theme. Reads the same localStorage key next-themes writes ("theme"),
      so the two agree from the very first frame.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // Default to dark; only "light" (or system resolving to light) goes light.
          var isDark = stored === 'system' ? prefersDark : stored !== 'light';
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          var color = isDark ? '#090909' : '#f7f4ed';
          var metas = document.querySelectorAll('meta[name="theme-color"], meta[name="msapplication-TileColor"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Critical CSS — mirrors the --background token for both themes so the
         first paint already matches the theme the bootstrap script picked. */
      html {
        background-color: #f7f4ed;
        color-scheme: light;
      }
      html.dark {
        background-color: #090909;
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: inherit;
        color: #231e1a;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html.dark body {
        color: #f7f7f7;
      }
      #root {
        min-height: 100vh;
      }
      /* Loading state */
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: inherit;
        z-index: 9999;
      }
      .initial-loader.hidden {
        display: none;
      }
      .initial-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(170, 66, 14, 0.2);
        border-top-color: #aa420e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      html.dark .initial-spinner {
        border: 3px solid rgba(251, 191, 36, 0.18);
        border-top-color: #fbbf24;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

  <body>
    <!-- Initial Loader (removed by React) -->
    <div class="initial-loader" id="initial-loader">
      <div class="initial-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove initial loader when React loads
      window.addEventListener('load', function() {
        setTimeout(function() {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
          }
        }, 500);
      });
    </script>
